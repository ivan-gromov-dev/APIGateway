services:
  gateway:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      billing:
        condition: service_started
  redis:
    image: redis:8.2.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
  identity:
    build:
      context: .
      dockerfile: deployments/identity.Dockerfile
    ports:
      - "8084:8084"
    environment:
      IDENTITY_ISSUER: http://identity:8084
      IDENTITY_CLIENT_ID: gateway-demo
      IDENTITY_CLIENT_SECRET: gateway-demo-secret
    healthcheck:
      test: ["CMD", "/identity", "-healthcheck", "http://localhost:8084/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
  backend-1:
    build:
      context: .
      dockerfile: deployments/backend.Dockerfile
    environment:
      SERVICE_NAME: backend-1
  backend-2:
    build:
      context: .
      dockerfile: deployments/backend.Dockerfile
    environment:
      SERVICE_NAME: backend-2
  backend-3:
    build:
      context: .
      dockerfile: deployments/backend.Dockerfile
    environment:
      SERVICE_NAME: backend-3
  billing:
    build:
      context: .
      dockerfile: deployments/billing.Dockerfile
    environment:
      SERVICE_NAME: billing-service

name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Build gateway
        run: go build ./cmd/gateway
      - name: Build users service
        run: go build ./examples/backend
      - name: Build billing service
        run: go build ./examples/billing
      - name: Build identity service
        run: go build ./examples/identity

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run static analysis
        run: go vet ./...
      - name: Test demo services
        run: go test -race -count=1 ./examples/...
      - name: Test coverage of each internal package
        shell: bash
        run: |
          threshold=75
          failed=0
          mkdir -p coverage

          while IFS= read -r package; do
            profile="coverage/$(echo "${package}" | tr '/.' '__').out"
            go test -race -covermode=atomic -coverprofile="${profile}" "${package}"
            percentage="$(go tool cover -func "${profile}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"

            printf "%-70s %6.1f%%\n" "${package}" "${percentage}"
            if ! awk -v coverage="${percentage}" -v threshold="${threshold}" \
              'BEGIN { exit !(coverage > threshold) }'; then
              echo "::error title=Coverage below threshold::${package} coverage ${percentage}% must be greater than ${threshold}%"
              failed=1
            fi
          done < <(go list ./internal/...)

          exit "${failed}"

  integration-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10
    env:
      REDIS_ADDRESS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run integration tests
        run: go test -race -count=1 ./test/integration/...

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - build
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: |
          set -eu
          printf 'build: %s\nunit-tests: %s\nintegration-tests: %s\n' \
            "$BUILD_RESULT" "$UNIT_TESTS_RESULT" "$INTEGRATION_TESTS_RESULT"
          test "$BUILD_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$INTEGRATION_TESTS_RESULT" = success

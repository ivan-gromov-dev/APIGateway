services:
  gateway:
    volumes:
      - ./configs/gateway.keycloak.yaml:/configs/gateway.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "8085:8080"
      - "9000:9000"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8085
    volumes:
      - ./deployments/keycloak/gateway-demo-realm.json:/opt/keycloak/data/import/gateway-demo-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

services:
  gateway:
    environment:
      GATEWAY_TELEMETRY_TRACING_ENABLED: "true"
      GATEWAY_TELEMETRY_TRACING_ENDPOINT: otel-collector:4318
      GATEWAY_TELEMETRY_TRACING_INSECURE: "true"
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deployments/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

volumes:
  tempo-data:

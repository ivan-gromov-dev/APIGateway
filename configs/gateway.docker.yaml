server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
admin:
  address: ":9090"
  read_timeout: 5s
  write_timeout: 10s
log:
  level: info
  format: json
middleware:
  request_timeout: 15s
  cors:
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed_headers: [Accept, Authorization, Content-Type, X-Request-ID]
retry:
  max_attempts: 3
  per_attempt_timeout: 2s
  backoff: 25ms
  statuses: [502, 503, 504]
circuit_breaker:
  failure_threshold: 5
  open_timeout: 30s
  failure_statuses: [502, 503, 504]
rate_limit:
  enabled: true
  default_backend: redis
  on_backend_error: allow
  operation_timeout: 100ms
  redis:
    address: redis:6379
    database: 0
    key_prefix: gateway:ratelimit
  rules:
    - name: gateway-capacity
      key: global
      filter: all
      token_bucket:
        requests_per_second: 1000
        burst: 1500
        ttl: 10m
auth:
  providers:
    demo:
      jwks_url: http://identity:8084/.well-known/jwks.json
      issuer: http://identity:8084
      audience: api-gateway
      algorithms: [RS256]
      clock_skew: 30s
      http_timeout: 2s
cache:
  enabled: true
  on_backend_error: allow
  operation_timeout: 100ms
  max_body_bytes: 1048576
  redis:
    address: redis:6379
    database: 0
    key_prefix: gateway:cache
routes:
  - path_prefix: /api/billing/
    upstreams:
      - http://billing:8091
    strip_prefix: true
    cache:
      enabled: true
      ttl: 30s
      vary_headers: [Accept]
    rate_limits:
      - name: billing-writes
        key: client_ip
        filter: writes_only
        token_bucket:
          requests_per_second: 5
          burst: 10
          ttl: 10m
  - path_prefix: /api/
    upstreams:
      - http://backend-1:8081
      - http://backend-2:8081
      - http://backend-3:8081
    strip_prefix: true
    auth:
      required: true
      provider: demo
      required_scopes: [users.read]

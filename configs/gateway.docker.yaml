server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
admin:
  address: ":9090"
  read_timeout: 5s
  write_timeout: 10s
log:
  level: info
  format: json
middleware:
  request_timeout: 15s
  cors:
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed_headers: [Accept, Authorization, Content-Type, X-Request-ID]
routes:
  - path_prefix: /api/billing/
    upstreams:
      - http://billing:8091
    strip_prefix: true
  - path_prefix: /api/
    upstreams:
      - http://backend-1:8081
      - http://backend-2:8081
      - http://backend-3:8081
    strip_prefix: true

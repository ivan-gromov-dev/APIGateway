server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

admin:
  address: ":9090"
  read_timeout: 5s
  write_timeout: 10s

log:
  level: info
  format: json

telemetry:
  tracing:
    enabled: false
    service_name: api-gateway
    endpoint: localhost:4318
    insecure: true
    sample_ratio: 1
    shutdown_timeout: 5s

middleware:
  request_timeout: 15s
  cors:
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed_headers: [Accept, Authorization, Content-Type, X-Request-ID]

retry:
  max_attempts: 3
  per_attempt_timeout: 2s
  backoff: 25ms
  statuses: [502, 503, 504]

grpc:
  enabled: false
  routes: []

circuit_breaker:
  failure_threshold: 5
  open_timeout: 30s
  failure_statuses: [502, 503, 504]

active_health_check:
  enabled: true
  path: /healthz
  interval: 10s
  timeout: 2s
  healthy_threshold: 2
  unhealthy_threshold: 3

rate_limit:
  enabled: false
  default_backend: redis
  on_backend_error: allow
  operation_timeout: 100ms
  redis:
    address: localhost:6379
    database: 0
    key_prefix: gateway:ratelimit
  rules: []

auth:
  providers: {}

cache:
  enabled: false
  on_backend_error: allow
  operation_timeout: 100ms
  max_body_bytes: 1048576
  redis:
    address: localhost:6379
    database: 0
    key_prefix: gateway:cache

routes:
  - path_prefix: /api/billing/
    upstreams:
      - http://localhost:8091
    strip_prefix: true
  - path_prefix: /api/
    upstreams:
      - http://localhost:8081
      - http://localhost:8082
      - http://localhost:8083
    strip_prefix: true
reload:
  interval: 30s

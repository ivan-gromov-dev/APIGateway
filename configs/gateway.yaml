server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

admin:
  address: ":9090"
  read_timeout: 5s
  write_timeout: 10s

log:
  level: info
  format: json

middleware:
  request_timeout: 15s
  cors:
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed_headers: [Accept, Authorization, Content-Type, X-Request-ID]

retry:
  max_attempts: 3
  per_attempt_timeout: 2s
  backoff: 25ms
  statuses: [502, 503, 504]

routes:
  - path_prefix: /api/billing/
    upstreams:
      - http://localhost:8091
    strip_prefix: true
  - path_prefix: /api/
    upstreams:
      - http://localhost:8081
      - http://localhost:8082
      - http://localhost:8083
    strip_prefix: true
